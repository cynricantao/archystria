palette = "matugen"
format = "$directory$git_branch$git_status$fill$cmd_duration$time$line_break$character"

[palettes.matugen]
surface = "{{colors.surface.default.hex}}"
surface_high = "{{colors.surface_container_high.default.hex}}"
text = "{{colors.on_surface.default.hex}}"
muted = "{{colors.on_surface_variant.default.hex}}"
primary = "{{colors.primary.default.hex}}"
on_primary = "{{colors.on_primary.default.hex}}"
secondary = "{{colors.secondary.default.hex}}"
tertiary = "{{colors.tertiary.default.hex}}"
error = "{{colors.error.default.hex}}"

[directory]
style = "bold primary"
format = "[ 󰉋 $path ]($style)"
truncation_length = 4
truncate_to_repo = false

[git_branch]
symbol = " "
style = "bold tertiary"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bold secondary"
format = "[$all_status$ahead_behind ]($style)"

[fill]
symbol = " "

[cmd_duration]
min_time = 800
style = "muted"
format = "[󱎫 $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "muted"
format = "[ $time ]($style)"

[character]
success_symbol = "[❯](bold primary)"
error_symbol = "[❯](bold error)"
vimcmd_symbol = "[❮](bold tertiary)"
