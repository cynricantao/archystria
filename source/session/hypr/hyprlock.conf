source = __USER_HOME__/.config/hypr/generated/hyprlock.conf
$font = Noto Sans

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fractional_scaling = 2
    fail_timeout = 1500
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 3, ease
    animation = fadeOut, 1, 3, ease
    animation = inputFieldColors, 1, 2, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = screenshot
    color = $matugen_bg
    blur_passes = 3
    blur_size = 7
    noise = 0.012
    contrast = 0.90
    brightness = 0.64
    vibrancy = 0.16
    vibrancy_darkness = 0.05
}

label {
    monitor =
    text = $TIME
    color = $matugen_fg
    font_size = 72
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000088)
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $matugen_muted
    font_size = 18
    font_family = $font
    position = 0, 92
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 420, 58
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.30
    dots_center = true
    fade_on_empty = false
    hide_input = false
    rounding = 14
    outer_color = $matugen_primary
    inner_color = $matugen_surface
    font_color = $matugen_fg
    check_color = rgba(9ece6aff)
    fail_color = $matugen_error
    capslock_color = rgba(e0af68ff)
    placeholder_text = <span foreground="##8b9bad">Password</span>
    fail_text = <span foreground="##f7768e">$FAIL <b>($ATTEMPTS)</b></span>
    check_text = <span foreground="##9ece6a">Checking…</span>
    font_family = $font
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(00000088)
    position = 0, -18
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = $matugen_muted
    font_size = 13
    font_family = $font
    position = 0, -70
    halign = center
    valign = center
}

label {
    monitor =
    text = Locked as $USER
    color = $matugen_muted
    font_size = 13
    font_family = $font
    position = 0, 28
    halign = center
    valign = bottom
}
