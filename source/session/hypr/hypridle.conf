# Desktop policy: lock, then power off displays. Automatic suspend is
# intentionally omitted; suspend remains an explicit confirmed session action.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
    inhibit_sleep = 2
}

# Lock after 10 minutes. Normal idle inhibitors are respected.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Turn displays off one minute after locking; wake them on activity.
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
